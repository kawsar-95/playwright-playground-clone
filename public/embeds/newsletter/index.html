<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Newsletter</title>
    <link rel="stylesheet" href="/embeds/embed.css" />
  </head>
  <body>
    <h1>Weekly news</h1>
    <form id="form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" />
      <label class="inline"><input id="digest" type="checkbox" /> Weekly digest</label>
      <button type="submit">Subscribe</button>
    </form>
    <div id="result" class="result success" role="status"></div>
    <script>
      document.getElementById('form').addEventListener('submit', function (event) {
        event.preventDefault();
        var email = document.getElementById('email').value || 'nobody';
        var digest = document.getElementById('digest').checked;
        document.getElementById('result').textContent =
          'Subscribed ' + email + (digest ? ' to the weekly digest' : '');
      });
    </script>
  </body>
</html>

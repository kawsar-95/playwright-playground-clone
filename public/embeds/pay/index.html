<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Payment</title>
    <link rel="stylesheet" href="/embeds/embed.css" />
  </head>
  <body>
    <form id="form">
      <label for="card">Card number</label>
      <input id="card" name="card" type="text" inputmode="numeric" placeholder="4242 4242 4242 4242" />
      <button type="submit">Pay</button>
    </form>
    <div id="result" class="result" role="status"></div>
    <script>
      var plans = { basic: { name: 'Basic', price: 5 }, pro: { name: 'Pro', price: 15 } };
      var plan = plans[new URLSearchParams(location.search).get('plan')] || plans.basic;
      document.getElementById('form').addEventListener('submit', function (event) {
        event.preventDefault();
        var digits = document.getElementById('card').value.replace(/\s+/g, '');
        var result = document.getElementById('result');
        if (!/^\d{16}$/.test(digits)) {
          result.className = 'result error';
          result.setAttribute('role', 'alert');
          result.textContent = 'Card number must have 16 digits';
          return;
        }
        result.className = 'result success';
        result.setAttribute('role', 'status');
        result.textContent = 'Paid $' + plan.price + ' for ' + plan.name;
      });
    </script>
  </body>
</html>

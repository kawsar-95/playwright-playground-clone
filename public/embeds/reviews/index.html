<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reviews</title>
    <link rel="stylesheet" href="/embeds/embed.css" />
  </head>
  <body>
    <form id="form">
      <label for="review">Your review</label>
      <input id="review" name="review" type="text" />
      <button type="submit">Post review</button>
    </form>
    <div id="result" class="result success" role="status"></div>
    <script>
      document.getElementById('form').addEventListener('submit', function (event) {
        event.preventDefault();
        var text = document.getElementById('review').value;
        document.getElementById('result').textContent = 'Review posted';
        window.parent.postMessage({ type: 'review-posted', text: text }, '*');
      });
    </script>
  </body>
</html>
